name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "debug or release"
        required: true
        default: release
        type: choice
        options:
          - release
          - debug

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the version bump commit can be pushed back.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      # v3 defaults to installing the removed legacy `tools` package and fails.
      # v4 installs platform-tools only.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Bump VERSION_CODE for release
        id: bump
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'release' }}
        run: |
          set -euo pipefail
          CODE=$(grep -E '^VERSION_CODE=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          NAME=$(grep -E '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          NEW=$((CODE + 1))
          sed -i "s/^VERSION_CODE=.*/VERSION_CODE=${NEW}/" version.properties
          echo "version_code=${NEW}" >> "$GITHUB_OUTPUT"
          echo "version_name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "Bumped VERSION_CODE: ${CODE} -> ${NEW} (NAME=${NAME})"
          cat version.properties

      - name: Decode release keystore
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret missing — release will fall back to debug signing."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/klvw-release.keystore
          printf 'storeFile=app/klvw-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build APK
        env:
          BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'release' }}
        run: |
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            ./gradlew :app:assembleRelease --stacktrace
          fi

      - name: Commit version bump
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.build_type == 'release') }}
        run: |
          set -euo pipefail
          if git diff --quiet -- version.properties; then
            echo "version.properties unchanged — skip commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "chore: bump VERSION_CODE to ${{ steps.bump.outputs.version_code }} [skip ci]"
          git push

      - name: Upload Debug APK
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: klvw-wallpaper-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.build_type == 'release') }}
        uses: actions/upload-artifact@v4
        with:
          name: klvw-wallpaper-release-${{ steps.bump.outputs.version_name }}-${{ steps.bump.outputs.version_code }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
